[project]
name = "automation-suite-full"
version = "0.1.0"
description = "Automation suite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10",
  "jinja2>=3.1",
  "playwright>=1.46",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
